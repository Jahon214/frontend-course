<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Course</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="bg-black w-full min-h-screen text-white flex items-center justify-center px-4">
  <div class="w-full max-w-xl">
    
    <div class="text-center mb-10">
      <h2 class="text-yellow-400 text-4xl font-bold mb-3">
        Frontend kursi
      </h2>
      <p class="text-gray-400">
        Chegirma asosida yozilish uchun ro'yxatdan o'ting
      </p>
    </div>

    <div class="bg-linear-to-br from-gray-900 to-gray-800 border border-yellow-500 rounded-2xl p-8 shadow-2xl">
      <form class="space-y-4">
        
        <input 
          class="w-full px-4 py-3 rounded-xl bg-black border border-gray-600 text-white placeholder-gray-400 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500 outline-none transition"
          placeholder="Ism-familiya"
          type="text"
        >

        <input 
          class="w-full px-4 py-3 rounded-xl bg-black border border-gray-600 text-white placeholder-gray-400 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500 outline-none transition"
          placeholder="+998"
          type="text"
        >

        <input 
          class="w-full px-4 py-3 rounded-xl bg-black border border-gray-600 text-white placeholder-gray-400 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500 outline-none transition"
          placeholder="Yoshingiz"
          type="number"
        >

        <button 
          class="w-full bg-yellow-500 text-black py-3 rounded-xl font-bold hover:bg-yellow-600 hover:scale-105 transition duration-300 shadow-lg"
        >
          Yuborish
        </button>

      </form>
    </div>

  </div>
</section>

    <!-- JavaScript -->
     <script src="app.js"></script>
</body>
</html>
