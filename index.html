<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Course</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="bg-black w-full min-h-screen text-white flex items-center justify-center px-4">
    <div class="w-full max-w-xl">
      <div class="text-center mb-10">
        <h2 class="text-yellow-400 text-4xl font-bold mb-3">
          Frontend kursi
        </h2>
        <p class="text-gray-400">
          Chegirma asosida yozilish uchun ro'yxatdan o'ting
        </p>
      </div>
      
      <div class="bg-linear-to-br from-gray-900 to-gray-800 border border-yellow-500 rounded-2xl p-8 shadow-2xl">
        <p class="text-yellow-400 font-bold mb-4 text-lg">Kursdan nima kutyapsiz?</p>
        <div class="flex flex-col gap-3">
          <label class="flex items-center gap-3 cursor-pointer hover:bg-gray-800 p-3 rounded-xl transition">
            <input type="radio" name="expectation" value="html_css_tailwind_js_react" class="accent-yellow-400" />
            <span>💻 HTML, CSS, TailwindCSS, JavaScript, React o‘rganish</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer hover:bg-gray-800 p-3 rounded-xl transition">
            <input type="radio" name="expectation" value="15_projects" class="accent-yellow-400" />
            <span>📂 15 ta real projectlar bilan ishlash</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer hover:bg-gray-800 p-3 rounded-xl transition">
            <input type="radio" name="expectation" value="it_jobs_ready" class="accent-yellow-400" />
            <span>🚀 IT kompaniyalarga ishga tayyorlash</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer hover:bg-gray-800 p-3 rounded-xl transition">
            <input type="radio" name="expectation" value="any_web_apps" class="accent-yellow-400" />
            <span>🌐 Istalgan turdagi saytlar va dasturlar yaratish</span>
          </label>
        </div>
        <form class="space-y-4 pt-5">
          <input
            class="w-full px-4 py-3 rounded-xl bg-black border border-gray-600 text-white placeholder-gray-400 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500 outline-none transition"
            placeholder="Ism-familiya" type="text">
          <input
            class="w-full px-4 py-3 rounded-xl bg-black border border-gray-600 text-white placeholder-gray-400 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500 outline-none transition"
            placeholder="+998" type="text">
          <input
            class="w-full px-4 py-3 rounded-xl bg-black border border-gray-600 text-white placeholder-gray-400 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-500 outline-none transition"
            placeholder="Yoshingiz" type="number">
          <button
            class="w-full bg-yellow-500 text-black py-3 rounded-xl font-bold hover:bg-yellow-600 hover:scale-105 transition duration-300 shadow-lg">
            Yuborish
          </button>
        </form>
      </div>

      

    </div>
  </section>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>

</html>
